# SonarQube Cloud analysis. Read docs/sonarcloud-analysis.md before changing anything here: two of
# these lines look like noise and are not.

sonar.organization=jefry-kurniawan
sonar.projectKey=jefrykurniaone_sistem-informasi-manajemen-keuangan
sonar.sourceEncoding=UTF-8

# `.` rather than a list of directories, deliberately. A list silently drops whatever it forgets to
# name: the root configuration files, the Dockerfile, scripts/ and .github/workflows, whose
# `githubactions:*` rules only the server reports, since SonarLint in the editor does not analyse
# workflow YAML at all.
sonar.sources=.

# `tests/**` is load-bearing, not tidiness: a file cannot be both source and test in one analysis,
# and the scanner fails outright with "Source and test paths overlap" if one is. `.claude` holds
# sub-agent worktrees, whole copies of this repository that would otherwise be analysed as part of
# it. `src/lib/paraglide` is Paraglide's compiled output. The rest is build and test output.
sonar.exclusions=tests/**,src/lib/paraglide/**,.svelte-kit/**,build/**,coverage/**,test-results/**,playwright-report/**,storage/**,node_modules/**,.claude/**

sonar.tests=tests

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirrors `test.coverage` in vite.config.ts, which instruments `src/lib/**/*.ts` only. Sonar cannot
# tell "not instrumented" from "not covered", so without this every new route and component counts
# as uncovered new code and the gate fails on work that is behaving exactly as designed. Keep this
# in step with vite.config.ts; do not delete it to "fix" a coverage number.
sonar.coverage.exclusions=src/routes/**,src/*.ts,**/*.svelte,scripts/**,drizzle/**,static/**,.github/**,*.ts,*.js

# Fail the pipeline when the quality gate fails, rather than posting a status nobody is blocked by.
sonar.qualitygate.wait=true
