name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: check, lint, test, build
    runs-on: ubuntu-latest

    # The PostgreSQL service for the `test` step. The credentials below are single-use values for
    # this container only: created and destroyed inside the same job, unreachable from outside the
    # runner, and not a reference to a repository secret. This is not a hardcoded-credential
    # finding — there is no real secret here to protect — so do not turn it into a secret.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: komplek_ci
          POSTGRES_PASSWORD: kata-sandi-ci-sekali-pakai
          POSTGRES_DB: komplek_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komplek_ci -d komplek_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check
        run: bun run check

      - name: lint
        run: bun run lint

      - name: test
        run: bun run test
        env:
          # localhost, not the service name `postgres`: this step runs directly on the runner
          # rather than inside another container, so that service name cannot be resolved here.
          # Only this step touches the database, so the variables live here rather than at job
          # level.
          DATABASE_URL: postgres://komplek_ci:kata-sandi-ci-sekali-pakai@localhost:5432/komplek_ci
          # A different database on the same server. The test harness refuses to run when this
          # value is identical to DATABASE_URL, and it creates this database itself on the first
          # connection, so it does not need to be declared through POSTGRES_DB above.
          TEST_DATABASE_URL: postgres://komplek_ci:kata-sandi-ci-sekali-pakai@localhost:5432/komplek_ci_test

      - name: build
        run: bun run build
