name: Gerbang mutu

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gerbang-mutu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerbang:
    name: check, lint, test, build
    runs-on: ubuntu-latest

    # Layanan PostgreSQL untuk langkah `test`. Kredensial di bawah ini adalah nilai sekali pakai
    # untuk container ini saja: dibuat dan dihapus di dalam job yang sama, tidak terjangkau dari
    # luar runner, dan bukan rujukan ke secret repositori. Ini bukan temuan kredensial-hardcode —
    # tidak ada rahasia sungguhan di sini untuk dilindungi — jadi jangan diganti jadi secret.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: komplek_ci
          POSTGRES_PASSWORD: kata-sandi-ci-sekali-pakai
          POSTGRES_DB: komplek_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komplek_ci -d komplek_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check
        run: bun run check

      - name: lint
        run: bun run lint

      - name: test
        run: bun run test
        env:
          # localhost, bukan nama layanan `postgres`: langkah ini berjalan langsung di runner,
          # bukan di dalam container lain, jadi nama layanan itu tidak bisa diselesaikan di sini.
          # Hanya langkah ini yang menyentuh basis data, jadi variabelnya ditaruh di sini saja,
          # bukan di tingkat job.
          DATABASE_URL: postgres://komplek_ci:kata-sandi-ci-sekali-pakai@localhost:5432/komplek_ci
          # Basis data lain pada peladen yang sama. Perkakas uji menolak berjalan kalau nilai ini
          # sama persis dengan DATABASE_URL, dan ia membuat basis data ini sendiri pada koneksi
          # pertama, jadi tidak perlu didaftarkan lewat POSTGRES_DB di atas.
          TEST_DATABASE_URL: postgres://komplek_ci:kata-sandi-ci-sekali-pakai@localhost:5432/komplek_ci_test

      - name: build
        run: bun run build
