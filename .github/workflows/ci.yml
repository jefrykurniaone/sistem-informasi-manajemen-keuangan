name: Gerbang mutu

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gerbang-mutu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerbang:
    name: check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check
        run: bun run check

      - name: lint
        run: bun run lint

      - name: test
        run: bun run test

      - name: build
        run: bun run build
