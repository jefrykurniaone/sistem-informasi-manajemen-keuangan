name: komplek

services:
  app:
    build:
      context: .
      target: dev
    environment:
      NODE_ENV: development
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-komplek}:${POSTGRES_PASSWORD:-kata-sandi-lokal-ganti-saya}@db:5432/${POSTGRES_DB:-komplek}
      # Written here rather than forwarded from .env, for the same reason as DATABASE_URL above:
      # one value cannot describe two network viewpoints. Inside this network the mail server is
      # `mailpit` on the port it really listens on; from a process on the host machine it is
      # `localhost` on the published MAILPIT_SMTP_PORT, which is what .env carries. Forwarding
      # SMTP_HOST made one of the two wrong whichever value was chosen.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@komplek.local}
      # These two mean the same thing on both sides of the network boundary, so they are forwarded.
      # An empty secret is not defaulted to a working one here: a store that signs download links
      # with a value published in a tracked file signs nothing. It fails when it is first used,
      # with a message naming the variable.
      FILE_STORE_ROOT: ${FILE_STORE_ROOT:-storage}
      FILE_STORE_SECRET: ${FILE_STORE_SECRET}
      # Same reasoning as FILE_STORE_SECRET just above: an empty secret is not defaulted to a
      # working one here, so signing sessions with a value published in a tracked file signs
      # nothing. It fails on the first request that touches authentication, with a message
      # naming the variable.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - '${APP_PORT:-5173}:5173'
    volumes:
      # The working tree is mounted so edits on the host reach the dev server. The two anonymous
      # volumes keep the container's own node_modules and .svelte-kit, which must never be
      # overwritten by the host copy.
      - .:/app
      - /app/node_modules
      - /app/.svelte-kit
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-komplek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kata-sandi-lokal-ganti-saya}
      POSTGRES_DB: ${POSTGRES_DB:-komplek}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Mount the parent directory, not `/var/lib/postgresql/data`. From PostgreSQL 18 the official
      # images store data in a major-version-specific subdirectory (`/var/lib/postgresql/18/docker`)
      # so that `pg_upgrade --link` does not cross a mount point boundary. A volume on the old
      # `/data` path makes the container refuse to start: "there appears to be PostgreSQL data in
      # /var/lib/postgresql/data (unused mount/volume)". Do not move this back.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-komplek} -d ${POSTGRES_DB:-komplek}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Web interface, opened at http://localhost:8025
      - '${MAILPIT_WEB_PORT:-8025}:8025'
      # SMTP
      - '${MAILPIT_SMTP_PORT:-1025}:1025'

volumes:
  db-data:
